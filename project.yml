name: IDShare
options:
  bundleIdPrefix: com.enzohoyos
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  IDShare:
    type: application
    platform: iOS
    sources:
      - path: IDShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzohoyos.idshare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PKXQTDC76Q
    dependencies:
      - target: IDShareExtension

  IDShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: IDShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enzohoyos.idshare.extension
        INFOPLIST_FILE: IDShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PKXQTDC76Q
    frameworks:
      - WebKit.framework
